<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상호성 체험 - 자동 매칭 게임</title>
    <!-- PeerJS 라이브러리 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; text-align: center; background-color: #f4f6f9; padding: 20px; color: #333; }
        .box { background: white; padding: 25px; border-radius: 12px; max-width: 500px; margin: 0 auto 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { font-size: 16px; padding: 10px; width: 70%; margin-bottom: 10px; text-align: center; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn-cooperate { background-color: #2ecc71; color: white; width: 48%; padding: 15px; font-size: 18px; }
        .btn-betray { background-color: #e74c3c; color: white; width: 48%; padding: 15px; font-size: 18px; }
        .btn-action { background-color: #3498db; color: white; width: 75%; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .score-board { display: flex; justify-content: space-around; font-size: 18px; margin: 15px 0; font-weight: bold; }
        .status { margin: 15px 0; font-weight: bold; color: #e67e22; min-height: 24px; }
        .log-box { height: 180px; overflow-y: auto; background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 6px; text-align: left; font-size: 14px; }
        .loader { display: inline-block; margin-top: 10px; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🤝 실시간 상호성(신뢰) 체험 게임</h2>

    <!-- 방 입장 화면 -->
    <div class="box" id="setup-box">
        <h3>학급 방 이름 입력</h3>
        <p style="font-size: 14px; color: #666;">선생님이 안내해 주신 방 이름을 입력해 주세요.</p>
        <input type="text" id="room-name" placeholder="예: ethics101" value="ethics101"><br>
        <button class="btn-action" onclick="joinLobby()">입장 및 매칭 시작</button>
        <div id="loading-msg" class="loader" style="display: none;">매칭 대기 중... (5초 내에 상대가 없으면 AI와 연결됩니다)</div>
    </div>

    <!-- 게임 진행 화면 -->
    <div class="box" id="game-box" style="display: none;">
        <p style="margin: 0; color: #7f8c8d; font-size: 14px;">상대방: <b id="opp-type" style="color:#2980b9;">다른 학생</b></p>
        <div class="score-board">
            <div>나: <span id="my-score">0</span>점</div>
            <div>라운드: <span id="round">1</span> / 10</div>
            <div>상대: <span id="opp-score">0</span>점</div>
        </div>

        <div class="status" id="status-msg">카드를 선택하세요.</div>

        <div style="display: flex; justify-content: space-between; margin: 20px 0;">
            <button class="btn-cooperate" id="btn-c" onclick="makeChoice('cooperate')">🤝 신뢰 (협력)</button>
            <button class="btn-betray" id="btn-b" onclick="makeChoice('betray')">🗡️ 배신</button>
        </div>

        <h4>라운드 기록</h4>
        <div class="log-box" id="log"></div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let isAI = false;
        
        let round = 1;
        let myScore = 0;
        let oppScore = 0;
        let myChoice = null;
        let oppChoice = null;

        // AI 봇용 상태 데이터 (상호성-팃포탯 전략)
        let lastUserMoveForAI = 'cooperate';

        function joinLobby() {
            const room = document.getElementById('room-name').value.trim();
            if (!room) return alert("방 이름을 입력해 주세요.");

            document.getElementById('loading-msg').style.display = 'block';
            
            // 랜덤 사용자 ID 생성 후 등록
            const myRandomId = room + "-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(myRandomId);

            peer.on('open', (id) => {
                // 이미 대기 중인 다른 학생 찾기 시도
                findOpponent(room);
            });

            // 내가 대기 중일 때 누군가 나에게 연결 신청을 한 경우
            peer.on('connection', (connection) => {
                conn = connection;
                isAI = false;
                setupConnection("친구 학생");
            });

            peer.on('error', (err) => {
                console.log("Peer error:", err);
            });
        }

        function findOpponent(room) {
            // 다른 무작위 ID 5개를 생성해 접속해본다.
            let connected = false;
            let attempts = 0;

            // 5초 동안 실제 플레이어 연결을 기다린 후, 연결이 없으면 AI 대전으로 전환 (홀수 인원 대응)
            const aiTimer = setTimeout(() => {
                if (!conn) {
                    startAIGame();
                }
            }, 5000);

            // 간단한 무작위 검색 알고리즘 (실제 접속 중인 다른 Peer 스캔)
            for (let i = 0; i < 5; i++) {
                let testId = room + "-" + Math.floor(1000 + Math.random() * 9000);
                if (testId !== peer.id) {
                    let tempConn = peer.connect(testId);
                    tempConn.on('open', () => {
                        if (!conn) {
                            clearTimeout(aiTimer);
                            conn = tempConn;
                            isAI = false;
                            setupConnection("친구 학생");
                        }
                    });
                }
            }
        }

        // 홀수 인원이거나 대기 시간이 길어지면 AI와 매칭
        function startAIGame() {
            isAI = true;
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('game-box').style.display = 'block';
            document.getElementById('opp-type').innerText = "🤖 AI 봇 (상호성 인공지능)";
            document.getElementById('status-msg').innerText = "AI와 대전이 시작되었습니다!";
        }

        function setupConnection(oppName) {
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('game-box').style.display = 'block';
            document.getElementById('opp-type').innerText = oppName;
            document.getElementById('status-msg').innerText = "상대방과 연결되었습니다! 카드를 선택하세요.";

            conn.on('data', (data) => {
                if (data.type === 'choice') {
                    oppChoice = data.value;
                    checkRoundResult();
                }
            });
        }

        function makeChoice(choice) {
            if (myChoice !== null) return;
            
            myChoice = choice;
            disableButtons(true);

            if (isAI) {
                // AI는 팃포탯(상호성) 전략: 첫 판은 협력, 이후엔 상대방의 이전 행동을 따라함
                oppChoice = (round === 1) ? 'cooperate' : lastUserMoveForAI;
                lastUserMoveForAI = choice; // 내 이번 행동을 AI가 기억함
                
                // 자연스러운 타이밍 연출
                document.getElementById('status-msg').innerText = "AI가 생각 중입니다...";
                setTimeout(() => {
                    checkRoundResult();
                }, 800);
            } else {
                document.getElementById('status-msg').innerText = "상대방의 선택을 기다리는 중...";
                conn.send({ type: 'choice', value: choice });
                checkRoundResult();
            }
        }

        function checkRoundResult() {
            if (myChoice !== null && oppChoice !== null) {
                let myGain = 0;
                let oppGain = 0;

                if (myChoice === 'cooperate' && oppChoice === 'cooperate') {
                    myGain = 3; oppGain = 3;
                } else if (myChoice === 'cooperate' && oppChoice === 'betray') {
                    myGain = 0; oppGain = 5;
                } else if (myChoice === 'betray' && oppChoice === 'cooperate') {
                    myGain = 5; oppGain = 0;
                } else {
                    myGain = 1; oppGain = 1;
                }

                myScore += myGain;
                oppScore += oppGain;

                document.getElementById('my-score').innerText = myScore;
                document.getElementById('opp-score').innerText = oppScore;

                let logBox = document.getElementById('log');
                let cText = myChoice === 'cooperate' ? '신뢰' : '배신';
                let oText = oppChoice === 'cooperate' ? '신뢰' : '배신';
                logBox.innerHTML = `<b>[${round}라운드]</b> 나: ${cText} | 상대: ${oText} ➔ 나(+${myGain}), 상대(+${oppGain})<br>` + logBox.innerHTML;

                round++;
                if (round <= 10) {
                    document.getElementById('round').innerText = round;
                    myChoice = null;
                    oppChoice = null;
                    disableButtons(false);
                    document.getElementById('status-msg').innerText = "다음 라운드! 카드를 선택하세요.";
                } else {
                    document.getElementById('status-msg').innerText = "🎉 게임 종료!";
                    setTimeout(() => {
                        alert(`게임 종료!\n최종 점수 - 나: ${myScore}점 / 상대: ${oppScore}점\n\n💡 상대방이 내 행동을 어떻게 따라왔는지, 신뢰를 유지했을 때의 결과를 서로 이야기해 봅시다.`);
                    }, 500);
                }
            }
        }

        function disableButtons(disabled) {
            document.getElementById('btn-c').disabled = disabled;
            document.getElementById('btn-b').disabled = disabled;
        }
    </script>
</body>
</html>
