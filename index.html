<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상호성과 신뢰의 게임</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f6f9; padding: 20px; }
        .card-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .cooperate { background-color: #2ecc71; color: white; }
        .betray { background-color: #e74c3c; color: white; }
        button:hover { transform: scale(1.05); }
        .scoreboard { display: flex; justify-content: space-around; background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .log-box { height: 150px; overflow-y: scroll; background: white; border: 1px solid #ccc; padding: 10px; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>

    <h1>🤝 상호성(Reciprocity) 체험 게임</h1>
    <p>상대방(컴퓨터)과 반복되는 거래를 합니다. 당신의 선택이 상대의 다음 행동을 바꿉니다!</p>

    <div class="scoreboard">
        <div><strong>라운드:</strong> <span id="round">1</span> / 10</div>
        <div><strong>내 점수:</strong> <span id="my-score">0</span>점</div>
        <div><strong>상대 점수:</strong> <span id="opp-score">0</span>점</div>
    </div>

    <h3>당신의 선택은?</h3>
    <div class="card-container">
        <button class="cooperate" onclick="playRound('cooperate')">🤝 협력하기 (신뢰)</button>
        <button class="betray" onclick="playRound('betray')">🗡️ 배신하기 (이기심)</button>
    </div>

    <h4>게임 기록</h4>
    <div class="log-box" id="log"></div>

    <script>
        let round = 1;
        let myScore = 0;
        let oppScore = 0;
        let lastUserMove = 'cooperate'; // 상대방(컴퓨터)은 팃포탯(상호성) 전략 사용

        function playRound(userMove) {
            if (round > 10) {
                alert("게임이 종료되었습니다! 총점: " + myScore + "점");
                return;
            }

            // 컴퓨터는 이전 라운드에 플레이어가 한 행동을 그대로 따라함 (상호성 원리)
            let oppMove = (round === 1) ? 'cooperate' : lastUserMove;
            
            let myGain = 0;
            let oppGain = 0;

            if (userMove === 'cooperate' && oppMove === 'cooperate') {
                myGain = 3; oppGain = 3;
            } else if (userMove === 'cooperate' && oppMove === 'betray') {
                myGain = 0; oppGain = 5;
            } else if (userMove === 'betray' && oppMove === 'cooperate') {
                myGain = 5; oppGain = 0;
            } else {
                myGain = 1; oppGain = 1;
            }

            myScore += myGain;
            oppScore += oppGain;

            // 로그 출력
            let logBox = document.getElementById("log");
            let userText = userMove === 'cooperate' ? '협력' : '배신';
            let oppText = oppMove === 'cooperate' ? '협력' : '배신';
            
            logBox.innerHTML = `<b>[${round}라운드]</b> 나: ${userText} | 상대: ${oppText} ➔ 나 (+${myGain}점), 상대 (+${oppGain}점)<br>` + logBox.innerHTML;

            // 상태 업데이트
            lastUserMove = userMove;
            document.getElementById("my-score").innerText = myScore;
            document.getElementById("opp-score").innerText = oppScore;

            if (round === 10) {
                setTimeout(() => {
                    alert(`게임 끝!\n내 최종 점수: ${myScore}점\n상대 최종 점수: ${oppScore}점\n\n💡 수업 질문: 상대방은 내가 한 행동을 그대로 따라 했습니다. 내가 배신했을 때와 협력했을 때 전체 점수는 어떻게 달라졌나요?`);
                }, 300);
            }

            round++;
            if(round <= 10) document.getElementById("round").innerText = round;
        }
    </script>
</body>
</html>
